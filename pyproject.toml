[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dicom-htj2k-middleware"
version = "1.0.0"
description = "DICOM middleware that intercepts store requests and recompresses pixel data to HTJ2K before forwarding to a cloud PACs"
requires-python = ">=3.10"
dependencies = [
    "pydicom>=2.4.0",
    "pynetdicom>=2.0.2",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.2.0",
    "imagecodecs>=2024.1.1",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
]

[project.scripts]
dicom-htj2k-middleware = "src.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
