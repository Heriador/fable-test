[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcm4chee-mcp-server"
version = "0.1.0"
description = "MCP server for monitoring and diagnosing a DCM4CHEE 5.33 PACS (status, queues, storage, logs, error diagnosis)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "PyYAML>=6.0",
]

[project.scripts]
dcm4chee-mcp-server = "dcm4chee_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dcm4chee_mcp = ["knowledge_base.yaml"]
